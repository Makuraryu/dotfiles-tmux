# prefix: Ctrl+b (default)

# 基础设置
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -as terminal-features ",*:RGB"
set -g history-limit 10000
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough on

# 鼠标支持
set -g mouse on

# 窗口/窗格索引从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi 复制模式
setw -g mode-keys vi

# 分割窗格（保持当前路径）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新建窗口保持当前路径
bind n new-window -c "#{pane_current_path}"

# 关闭窗口
bind c kill-window

# 窗格切换（vim 风格）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 重载配置
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Earth Tone 状态栏 ───────────────────────────────────────────────────────
# 配色
et_bg='#2C2416'       # 深咖啡底色
et_fg='#D4B896'       # 沙色文字
et_accent='#C4822A'   # 琥珀橙（主强调）
et_dim='#6B5A42'      # 暗棕（分隔/非活跃）
et_active='#8FA65A'   # 苔绿（活跃窗口）
et_bar='#3E3020'      # 状态栏底色

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=${et_bar},fg=${et_fg}"

# 左侧：会话名
set -g status-left-length 30
set -g status-left "#[bg=${et_accent},fg=${et_bg},bold] 󰆍 #S #[bg=${et_bar},fg=${et_accent}]"

# 右侧：prefix 高亮 + 时间日期
set -g status-right-length 60
set -g status-right "#{prefix_highlight}#[fg=${et_dim}] │ #[fg=${et_fg}]%H:%M #[fg=${et_dim}]│ #[fg=${et_fg}]%Y-%m-%d "

# 窗口列表居左
set -g status-justify left

# 非活跃窗口
setw -g window-status-format " #[fg=${et_dim}]#I #[fg=${et_fg}]#W#{?window_zoomed_flag, 󰍉,} "
setw -g window-status-separator ""

# 活跃窗口
setw -g window-status-current-format "#[bg=${et_bg},fg=${et_bar}]#[bg=${et_bg},fg=${et_active},bold] #I  #W#{?window_zoomed_flag, 󰍉,} #[bg=${et_bar},fg=${et_bg}]"

# 窗格边框
set -g pane-border-style "fg=${et_dim}"
set -g pane-active-border-style "fg=${et_accent}"

# 消息栏
set -g message-style "bg=${et_accent},fg=${et_bg},bold"

# ── 插件 ────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

# prefix 高亮
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_fg '#2C2416'
set -g @prefix_highlight_bg '#C4822A'
set -g @prefix_highlight_prefix_prompt ' Prefix'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=#2C2416,bg=#8FA65A"
set -g @prefix_highlight_copy_prompt ' Copy'

# 初始化 TPM（保持在最后一行）
run '~/.tmux/plugins/tpm/tpm'
